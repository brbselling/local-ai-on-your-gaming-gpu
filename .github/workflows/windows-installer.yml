# Checks install.ps1 and windows/bonsai2.ps1 on a real Windows PowerShell 5.1, and install.sh in bash, with fake cards.
# The runners have no GPU, so the big downloads and the model start are skipped (BONSAI_TEST).
# AMD Radeon (beta): fake Radeons on both systems (Windows: BONSAI_FAKE_AMD and BONSAI_FAKE_VK, Linux: a fake
# /sys/class/drm tree and a stand-in llama-server that lists Vulkan devices), and the real PrismML Vulkan builds.
name: installer check

on:
  push:
    branches: [main, windows, amd]
    paths: ['install.ps1', 'install.sh', 'windows/**', '.github/workflows/windows-installer.yml']
  pull_request:
    paths: ['install.ps1', 'install.sh', 'windows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - card: 'RTX 3060 12GB'
            gpu: '0, NVIDIA GeForce RTX 3060, 12288, 595.95, 8.6'
            tier: '12gb'
            build: 'cuda12.4-sm86-sm89'
          - card: 'RTX 5060 Ti 16GB'
            gpu: '0, NVIDIA GeForce RTX 5060 Ti, 16311, 595.95, 12.0'
            tier: '16gb'
            build: 'cuda13.3-sm120'
          - card: 'RTX 3000 Ada Laptop 8GB'
            gpu: '0, NVIDIA RTX 3000 Ada Generation Laptop GPU, 8188, 595.95, 8.9'
            tier: '8gb'
            build: 'cuda12.4-sm86-sm89'
            ctx8: '49152'
          - card: 'RTX 2070 Super 8GB (Turing)'
            gpu: '0, NVIDIA GeForce RTX 2070 SUPER, 8192, 595.84, 7.5'
            tier: '8gb'
            build: 'cuda12.4-sm75'
            ctx8: '49152'
          - card: 'GTX 1660 Super 6GB (refused)'
            gpu: '0, NVIDIA GeForce GTX 1660 SUPER, 6144, 595.95, 7.5'
            tier: 'none'
            build: 'none'
          # the uncensored build (BONSAI_MODEL=offrail): the same tiers, the weights from its own repo, its own model name
          - card: 'RTX 3060 12GB (offrail)'
            gpu: '0, NVIDIA GeForce RTX 3060, 12288, 595.95, 8.6'
            tier: '12gb'
            build: 'cuda12.4-sm86-sm89'
            variant: 'offrail'
            alias: 'offrail-27b'
          - card: 'RTX 5060 Ti 16GB (offrail)'
            gpu: '0, NVIDIA GeForce RTX 5060 Ti, 16311, 595.95, 12.0'
            tier: '16gb'
            build: 'cuda13.3-sm120'
            variant: 'offrail'
            alias: 'offrail-27b'
          - card: 'RTX 3000 Ada Laptop 8GB (offrail)'
            gpu: '0, NVIDIA RTX 3000 Ada Generation Laptop GPU, 8188, 595.95, 8.9'
            tier: '8gb'
            build: 'cuda12.4-sm86-sm89'
            ctx8: '49152'
            variant: 'offrail'
            alias: 'offrail-27b'
          - card: 'Radeon RX 7600 8GB, desktop on it (offrail)'
            amd: 'AMD Radeon RX 7600, 8192, 16304, 25.9.1'
            vk: '  Vulkan0: AMD Radeon RX 7600 (8176 MiB, 7476 MiB free)'
            tier: '8gb'
            build: 'win-vulkan'
            dev: 'Vulkan0'
            ctx8: '49152'
            dq: 'yes'
            variant: 'offrail'
            alias: 'offrail-27b'
          - card: 'GTX 1660 Super 6GB (refused, offrail)'
            gpu: '0, NVIDIA GeForce GTX 1660 SUPER, 6144, 595.95, 7.5'
            tier: 'none'
            build: 'none'
            variant: 'offrail'
            alias: 'offrail-27b'
          - card: 'RTX 3060 12GB, a typo in BONSAI_MODEL (refused)'
            gpu: '0, NVIDIA GeForce RTX 3060, 12288, 595.95, 8.6'
            tier: 'none'
            build: 'none'
            variant: 'offrial'
          - card: 'RTX 5070 on an old driver (refused)'
            gpu: '0, NVIDIA GeForce RTX 5070, 12227, 572.16, 12.0'
            tier: 'none'
            build: 'none'
          - card: 'Radeon RX 7600 8GB, desktop on it'
            amd: 'AMD Radeon RX 7600, 8192, 16304, 25.9.1'
            vk: '  Vulkan0: AMD Radeon RX 7600 (8176 MiB, 7476 MiB free)'
            tier: '8gb'
            build: 'win-vulkan'
            dev: 'Vulkan0'
            ctx8: '49152'
            dq: 'yes'
          - card: 'Radeon RX 6700 XT 12GB'
            amd: 'AMD Radeon RX 6700 XT, 12288, 16304, 25.9.1'
            vk: '  Vulkan0: AMD Radeon RX 6700 XT (12272 MiB, 11500 MiB free)'
            tier: '12gb'
            build: 'win-vulkan'
            dev: 'Vulkan0'
            dq: 'yes'
          - card: 'Radeon RX 7800 XT 16GB'
            amd: 'AMD Radeon RX 7800 XT, 16384, 16304, 25.9.1'
            vk: '  Vulkan0: AMD Radeon RX 7800 XT (16368 MiB, 15800 MiB free)'
            tier: '16gb'
            build: 'win-vulkan'
            dev: 'Vulkan0'
          - card: 'Ryzen iGPU + Radeon RX 7600 desktop'
            amd: 'AMD Radeon(TM) Graphics, 512, 16304, 25.9.1; AMD Radeon RX 7600, 8192, 16304, 25.9.1'
            vk: '  Vulkan0: AMD Radeon(TM) Graphics (16816 MiB, 16000 MiB free);  Vulkan1: AMD Radeon RX 7600 (8176 MiB, 7900 MiB free)'
            tier: '8gb'
            build: 'win-vulkan'
            dev: 'Vulkan1'
            ctx8: '65536'
            dq: 'yes'
          - card: 'Radeon 8060S APU, 128 GB'
            amd: 'AMD Radeon(TM) 8060S Graphics, 512, 65280, 25.9.1'
            vk: '  Vulkan0: AMD Radeon(TM) 8060S Graphics (65792 MiB, 64000 MiB free)'
            tier: '16gb'
            build: 'win-vulkan'
            dev: 'Vulkan0'
          - card: 'Radeon RX 6500 XT 4GB (refused)'
            amd: 'AMD Radeon RX 6500 XT, 4096, 16304, 25.9.1'
            tier: 'none'
            build: 'none'
          - card: 'Radeon 780M APU on 16 GB of RAM (refused)'
            amd: 'AMD Radeon(TM) 780M Graphics, 512, 7900, 25.9.1'
            tier: 'none'
            build: 'none'

    name: ${{ matrix.card }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse in Windows PowerShell 5.1, ASCII only
        shell: powershell
        run: |
          foreach ($f in 'install.ps1', 'windows\bonsai2.ps1') {
            $errs = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Host "$f line $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
            if ([IO.File]::ReadAllText((Resolve-Path $f).Path) -match '[^\x00-\x7F]') { Write-Host "$f has non-ASCII characters"; exit 1 }
          }
          Write-Host 'both scripts parse, ASCII only'

      - name: Install for ${{ matrix.card }} the way irm | iex runs it
        shell: powershell
        env:
          BONSAI_FAKE_GPU: ${{ matrix.gpu }}
          BONSAI_FAKE_AMD: ${{ matrix.amd }}
          BONSAI_FAKE_VK: ${{ matrix.vk }}
          BONSAI_FAKE_FREE: '7900'
          BONSAI_TEST: '1'
          BONSAI_MODEL: ${{ matrix.variant }}
          BONSAI_HUB_DIR: ${{ github.workspace }}
          BONSAI_DIR: ${{ runner.temp }}\bonsai2
        run: |
          Get-Content .\install.ps1 -Raw | Invoke-Expression
          $d = $env:BONSAI_DIR
          if ('${{ matrix.tier }}' -eq 'none') {
            if (Test-Path "$d\bonsai2.json") { throw 'it installed on a card it should refuse' }
            Write-Host 'refused, as it should'
            exit 0
          }
          $cfg = Get-Content "$d\bonsai2.json" -Raw | ConvertFrom-Json
          $cfg | Format-List | Out-String | Write-Host
          if ($cfg.tier -ne '${{ matrix.tier }}') { throw "tier $($cfg.tier), expected ${{ matrix.tier }}" }
          if ($cfg.build -notlike '*${{ matrix.build }}*') { throw "build $($cfg.build), expected ${{ matrix.build }}" }
          foreach ($f in 'start-bonsai.bat', 'bench-bonsai.bat', 'bonsai2.ps1', 'vision_check.png', 'bonsai2.json') {
            if (-not (Test-Path "$d\$f")) { throw "$f missing" }
          }
          Get-Content "$d\start-bonsai.bat" | Write-Host
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File "$d\bonsai2.ps1" print | Out-String
          Write-Host $out
          if ($out -notmatch 'draft-mtp') { throw 'print mode shows no draft-mtp line' }
          $wantAlias = if ('${{ matrix.alias }}') { '${{ matrix.alias }}' } else { 'bonsai-2-27b' }
          if ($out -notmatch "--alias $wantAlias") { throw "agents need the $wantAlias model name" }
          if ($out -notmatch '--host 127.0.0.1') { throw 'it should serve on 127.0.0.1 by default' }
          if ('${{ matrix.tier }}' -eq '8gb' -and $out -notmatch '-c ${{ matrix.ctx8 }} ') { throw '8gb tier should pick -c ${{ matrix.ctx8 }} here' }
          if ('${{ matrix.tier }}' -ne '8gb' -and $out -notmatch '--fit on') { throw 'this tier should use --fit on' }
          if ('${{ matrix.tier }}' -eq '16gb' -and $out -notmatch 'mmproj') { throw '16gb tier should load the vision file' }
          if ('${{ matrix.variant }}' -eq 'offrail') {
            if ($cfg.variant -ne 'offrail') { throw "bonsai2.json should say offrail, it says $($cfg.variant)" }
            if ($cfg.name -ne 'Offrail 27B') { throw "the build should be called Offrail 27B, it is $($cfg.name)" }
            if ($cfg.alias -ne '${{ matrix.alias }}') { throw "the chat model should be ${{ matrix.alias }}, it is $($cfg.alias)" }
            if ($cfg.model -notlike 'Offrail-27B-*') { throw "the model file should be an Offrail one, it is $($cfg.model)" }
            if ($out -notmatch 'Offrail-27B-') { throw 'the launcher should load an Offrail weight' }
          }
          if ('${{ matrix.amd }}' -ne '') {
            if ($cfg.backend -ne 'vulkan') { throw 'a Radeon should get the Vulkan backend' }
            if ($out -notmatch '--device ${{ matrix.dev }} ') { throw 'it should run on ${{ matrix.dev }} only' }
            if ($out -notmatch '--spec-draft-n-max 2') { throw 'Radeon tiers draft 2 tokens' }
            if ($out -notmatch 'win-vulkan-x64\\llama-server\.exe') { throw 'the Vulkan build has its files in the build folder itself' }
            if ('${{ matrix.tier }}' -eq '12gb' -and $out -match 'mmproj') { throw '12gb tier should not load the vision file' }
            if ('${{ matrix.dq }}' -eq 'yes' -and $out -notmatch '-ctkd q4_0 -ctvd q4_0') { throw 'this card should get the q4_0 draft cache' }
            if ('${{ matrix.dq }}' -ne 'yes' -and $out -match '-ctkd') { throw 'this card should keep the f16 draft cache' }
            if (@('8gb', '12gb') -contains '${{ matrix.tier }}' -and $out -notmatch '-ub 256') { throw '8 and 12 GB Radeons run ubatch 256' }
            if (@('8gb', '12gb') -notcontains '${{ matrix.tier }}' -and $out -match '-ub 256') { throw 'only 8 and 12 GB Radeons run ubatch 256' }
          }

      # The uncensored build fetches its weights from a SECOND Hugging Face repo, with its own SHA256SUMS.
      # BONSAI_TEST skips the downloads, so that plumbing needs its own step: two fake repos over file://, tiny
      # files, and the real download, verify and unpack code runs. One row only.
      - name: The second repo, with fake repos (the Offrail manifest and the model switch)
        if: matrix.card == 'RTX 3060 12GB (offrail)'
        shell: powershell
        env:
          BONSAI_FAKE_GPU: '0, NVIDIA GeForce RTX 3060, 12288, 595.95, 8.6'
          BONSAI_NO_PROMPT: '1'
          BONSAI_NO_START: '1'
          BONSAI_HUB_DIR: ${{ github.workspace }}
        run: |
          $S = Join-Path $env:RUNNER_TEMP 'fakerepos'
          Remove-Item $S -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$S\base", "$S\offrail", "$S\run" | Out-Null
          $zip = 'bonsai2-small-gpu-windows-x64-cuda12.4-sm86-sm89-ff41412'
          New-Item -ItemType Directory -Force -Path "$S\pack\$zip\bin" | Out-Null
          Set-Content "$S\pack\$zip\bin\llama-server.exe" 'stub' -Encoding ASCII
          Compress-Archive -Path "$S\pack\$zip" -DestinationPath "$S\base\$zip.zip" -Force
          Set-Content "$S\base\Ternary-Bonsai-2-27B-PTQ1_0-mtp.gguf" 'FAKE-BASE-MTP' -Encoding ASCII
          Set-Content "$S\offrail\Offrail-27B-12G.gguf" 'FAKE-OFFRAIL-12G' -Encoding ASCII
          function New-Manifest($d) {
            $lines = foreach ($f in (Get-ChildItem $d -File | Where-Object { $_.Name -ne 'SHA256SUMS' })) {
              '{0}  {1}' -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name
            }
            Set-Content "$d\SHA256SUMS" ($lines -join "`n") -Encoding ASCII
          }
          New-Manifest "$S\base"; New-Manifest "$S\offrail"
          $env:BONSAI_HF = 'file:///' + ("$S\base" -replace '\\', '/')
          $env:BONSAI_OFFRAIL_HF = 'file:///' + ("$S\offrail" -replace '\\', '/')
          $env:BONSAI_DIR = "$S\run"
          $env:BONSAI_MODEL = 'offrail'
          Get-Content .\install.ps1 -Raw | Invoke-Expression
          $cfg = Get-Content "$S\run\bonsai2.json" -Raw | ConvertFrom-Json
          if ($cfg.variant -ne 'offrail') { throw "variant $($cfg.variant), expected offrail" }
          if ($cfg.alias -ne 'offrail-27b') { throw "alias $($cfg.alias), expected offrail-27b" }
          if ($cfg.model -ne 'Offrail-27B-12G.gguf') { throw "model $($cfg.model), expected Offrail-27B-12G.gguf" }
          if (-not (Test-Path "$S\run\models\Offrail-27B-12G.gguf")) { throw 'the Offrail weight was not fetched' }
          if (Test-Path "$S\run\models\Ternary-Bonsai-2-27B-PTQ1_0-mtp.gguf") { throw 'it fetched the base weight instead' }
          if (-not (Test-Path "$S\run\$zip\bin\llama-server.exe")) { throw 'the bundle from the base repo was not unpacked' }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File "$S\run\bonsai2.ps1" print | Out-String
          if ($out -notmatch '--alias offrail-27b') { throw 'the launcher does not answer to offrail-27b' }
          if ($out -notmatch 'Offrail-27B-12G\.gguf') { throw 'the launcher does not load the Offrail weight' }
          Write-Host 'both manifests read, the weight came from the second repo, the launcher follows'

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { card: 'RTX 3060 12GB', gpu: '0, NVIDIA GeForce RTX 3060, 12288, 595.95, 8.6', tier: '12gb', bundle: 'cuda12.4-sm86-sm89', nmax: '1' }
          - { card: 'RTX 5060 Ti 16GB', gpu: '0, NVIDIA GeForce RTX 5060 Ti, 16311, 595.95, 12.0', tier: '16gb', bundle: 'cuda12.8-sm120', nmax: '1' }
          - { card: 'RTX 3000 Ada Laptop 8GB', gpu: '0, NVIDIA RTX 3000 Ada Generation Laptop GPU, 8188, 595.95, 8.9', tier: '8gb', bundle: 'cuda12.4-sm86-sm89', nmax: '2', ctx8: '49152' }
          - { card: 'RTX 2070 Super 8GB (Turing)', gpu: '0, NVIDIA GeForce RTX 2070 SUPER, 8192, 595.84, 7.5', tier: '8gb', bundle: 'cuda12.4-sm75', nmax: '1', ctx8: '49152' }
          - { card: 'GTX 1660 Super 6GB (refused)', gpu: '0, NVIDIA GeForce GTX 1660 SUPER, 6144, 595.95, 7.5', tier: 'none', bundle: 'none' }
          # the uncensored build (--model offrail): the same tiers, the weights from its own repo, its own model name
          - { card: 'RTX 3060 12GB (offrail)', gpu: '0, NVIDIA GeForce RTX 3060, 12288, 595.95, 8.6', tier: '12gb', bundle: 'cuda12.4-sm86-sm89', nmax: '1', variant: 'offrail', alias: 'offrail-27b' }
          - { card: 'RTX 5060 Ti 16GB (offrail)', gpu: '0, NVIDIA GeForce RTX 5060 Ti, 16311, 595.95, 12.0', tier: '16gb', bundle: 'cuda12.8-sm120', nmax: '1', variant: 'offrail', alias: 'offrail-27b' }
          - { card: 'RTX 3000 Ada Laptop 8GB (offrail)', gpu: '0, NVIDIA RTX 3000 Ada Generation Laptop GPU, 8188, 595.95, 8.9', tier: '8gb', bundle: 'cuda12.4-sm86-sm89', nmax: '2', ctx8: '49152', lean: 'Offrail-27B-8G', variant: 'offrail', alias: 'offrail-27b' }
          - { card: 'Radeon RX 7600 8GB (offrail)', drm: 'card1 0x1002 8176 15000 AMD Radeon RX 7600',
              vk: '  Vulkan0: AMD Radeon RX 7600 (RADV NAVI33) (8176 MiB, 7476 MiB free)', tier: '8gb', dev: 'Vulkan0', ctx8: '49152', dq: 'yes', lean: 'Offrail-27B-8G', variant: 'offrail', alias: 'offrail-27b' }
          - { card: 'GTX 1660 Super 6GB (refused, offrail)', gpu: '0, NVIDIA GeForce GTX 1660 SUPER, 6144, 595.95, 7.5', tier: 'none', bundle: 'none', variant: 'offrail', alias: 'offrail-27b' }
          # Radeons: drm = 'cardN vendor VRAM-MiB GTT-MiB name' per card, vk = what the Vulkan build lists at start
          - { card: 'Radeon RX 7600 8GB, desktop on it', drm: 'card1 0x1002 8176 15000 AMD Radeon RX 7600',
              vk: '  Vulkan0: AMD Radeon RX 7600 (RADV NAVI33) (8176 MiB, 7476 MiB free)', tier: '8gb', dev: 'Vulkan0', ctx8: '49152', dq: 'yes' }
          - { card: 'Radeon RX 6700 XT 12GB', drm: 'card1 0x1002 12272 15000 AMD Radeon RX 6700 XT',
              vk: '  Vulkan0: AMD Radeon RX 6700 XT (RADV NAVY_FLOUNDER) (12272 MiB, 11500 MiB free)', tier: '12gb', dev: 'Vulkan0', dq: 'yes' }
          - { card: 'Radeon RX 7800 XT 16GB', drm: 'card1 0x1002 16368 15000 AMD Radeon RX 7800 XT',
              vk: '  Vulkan0: AMD Radeon RX 7800 XT (RADV NAVI32) (16368 MiB, 15800 MiB free)', tier: '16gb', dev: 'Vulkan0' }
          - { card: 'Ryzen iGPU + Radeon RX 7600 desktop, an NVIDIA entry too',
              drm: 'card0 0x1002 512 15000 AMD Radeon Graphics;card1 0x1002 8176 15000 AMD Radeon RX 7600;card2 0x10de 12288 0 NVIDIA',
              vk: '  Vulkan0: AMD Radeon Graphics (RADV RAPHAEL_MENDOCINO) (15512 MiB, 15000 MiB free);  Vulkan1: AMD Radeon RX 7600 (RADV NAVI33) (8176 MiB, 8160 MiB free)',
              tier: '8gb', dev: 'Vulkan1', ctx8: '65536', dq: 'no' }
          - { card: 'Radeon 8060S APU, 128 GB', drm: 'card1 0x1002 512 117760 AMD Radeon 8060S Graphics',
              vk: '  Vulkan0: AMD Radeon Graphics (RADV GFX1151) (118272 MiB, 116000 MiB free)', tier: '16gb', dev: 'Vulkan0' }
          - { card: 'Radeon RX 6500 XT 4GB (refused)', drm: 'card1 0x1002 4080 15000 AMD Radeon RX 6500 XT', tier: 'none' }
          - { card: 'Radeon 780M APU on 16 GB of RAM (refused)', drm: 'card1 0x1002 512 7800 AMD Radeon 780M Graphics', tier: 'none' }
          - { card: 'Radeon RX 7600 without Vulkan (refused)', drm: 'card1 0x1002 8176 15000 AMD Radeon RX 7600', icd: '/nonexistent', tier: 'none' }
    name: linux ${{ matrix.card }}
    steps:
      - uses: actions/checkout@v4
      - name: A fake Radeon in /sys/class/drm, and Mesa's Vulkan driver
        if: matrix.drm != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers libvulkan1 >/dev/null
          ls /usr/share/vulkan/icd.d/
          IFS=';' read -ra cards <<< '${{ matrix.drm }}'
          for c in "${cards[@]}"; do
            read -r card vendor vram gtt name <<< "$c"
            d="$RUNNER_TEMP/drm/$card/device"; mkdir -p "$d" "$RUNNER_TEMP/drm/$card-DP-1"
            echo "$vendor" > "$d/vendor"; echo $((vram * 1048576)) > "$d/mem_info_vram_total"; echo $((gtt * 1048576)) > "$d/mem_info_gtt_total"
            echo "$name" > "$d/product_name"
          done
          find "$RUNNER_TEMP/drm" | sort
      - name: Install for ${{ matrix.card }} the way curl | bash runs it
        env:
          BONSAI_FAKE_GPU: ${{ matrix.gpu }}
          BONSAI_DRM: ${{ runner.temp }}/drm
          BONSAI_VK_ICD_DIR: ${{ matrix.icd }}
          BONSAI_TEST: '1'
          BONSAI_MODEL: ${{ matrix.variant }}
          BONSAI_DIR: ${{ runner.temp }}/bonsai2
        run: |
          bash -n install.sh
          set +e; cat install.sh | bash 2>&1 | tee "$RUNNER_TEMP/install.out"; rc=${PIPESTATUS[1]}; set -e
          if [ '${{ matrix.tier }}' = none ]; then [ $rc -ne 0 ] && [ ! -f "$BONSAI_DIR/start-bonsai.sh" ] && echo 'refused, as it should' && exit 0; echo 'it installed on a card it should refuse'; exit 1; fi
          [ $rc -eq 0 ] || exit 1
          bash -n "$BONSAI_DIR/start-bonsai.sh"
          cat "$BONSAI_DIR/start-bonsai.sh"
          grep -q 'draft-mtp' "$BONSAI_DIR/start-bonsai.sh"
          WANT_ALIAS='${{ matrix.alias }}'; [ -n "$WANT_ALIAS" ] || WANT_ALIAS='bonsai-2-27b'
          LEAN='${{ matrix.lean }}'; [ -n "$LEAN" ] || LEAN='mtp-lean'
          SLUG='bonsai2'; [ -z '${{ matrix.variant }}' ] || SLUG='offrail'
          # the closing lines tell agents which model name to use; it must be this build's
          grep -q "OpenAI compatible, model $WANT_ALIAS, any API key" "$RUNNER_TEMP/install.out"
          if [ -z '${{ matrix.drm }}' ]; then
            grep -q -- "--alias $WANT_ALIAS" "$BONSAI_DIR/start-bonsai.sh"
            grep -q '${{ matrix.bundle }}' "$BONSAI_DIR/start-bonsai.sh"
            case '${{ matrix.tier }}' in
              8gb)  grep -q 'C=49152' "$BONSAI_DIR/start-bonsai.sh" && grep -q "$LEAN" "$BONSAI_DIR/start-bonsai.sh" ;;
              16gb) grep -q -- '--mmproj' "$BONSAI_DIR/start-bonsai.sh" && grep -q -- '--fit on' "$BONSAI_DIR/start-bonsai.sh" ;;
              12gb) grep -q -- '--fit on' "$BONSAI_DIR/start-bonsai.sh" && ! grep -q -- '--mmproj' "$BONSAI_DIR/start-bonsai.sh" ;;
            esac
            # NVIDIA: the start script against stand-ins, an nvidia-smi that reports 7,900 MiB free and a llama-server that
            # prints its arguments, then the speed check end to end against a stand-in server with fixed timings
            F="$RUNNER_TEMP/fakebin"; mkdir -p "$F"
            printf '%s\n' '#!/bin/bash' 'case "$*" in *memory.free*) echo 7900 ;; *memory.used*) echo 512 ;; *) echo "nvidia-smi stand-in" ;; esac' > "$F/nvidia-smi"
            chmod +x "$F/nvidia-smi"
            B="$BONSAI_DIR/$(sed -n 's|^B="\$DIR/\(.*\)"$|\1|p' "$BONSAI_DIR/start-bonsai.sh")/bin"; mkdir -p "$B"
            printf '%s\n' '#!/bin/bash' 'echo "SERVER ARGS: $*"' > "$B/llama-server"; chmod +x "$B/llama-server"
            out=$(PATH="$F:$PATH" bash "$BONSAI_DIR/start-bonsai.sh"); echo "$out"
            args=$(grep '^SERVER ARGS:' <<< "$out")
            grep -q -- '--spec-type draft-mtp --spec-draft-n-max ${{ matrix.nmax }}' <<< "$args"
            grep -q '^NVIDIA: GPU 0, 7900 MiB free' <<< "$out"
            if [ '${{ matrix.tier }}' = 8gb ]; then grep -q -- '-c ${{ matrix.ctx8 }} --fit off' <<< "$args"; fi
            out=$(PATH="$F:$PATH" BONSAI_HEAD=off bash "$BONSAI_DIR/start-bonsai.sh"); echo "$out"
            ! grep -q 'draft-mtp' <<< "$(grep '^SERVER ARGS:' <<< "$out")"
            bash -n "$BONSAI_DIR/bench-bonsai.sh"
            printf '%s\n' '#!/usr/bin/env python3' 'import http.server, json, sys' 'a = sys.argv[1:]' \
              'head = "--spec-type" in a; ctx = int(a[a.index("-c") + 1]) if "-c" in a else 131072' \
              'class H(http.server.BaseHTTPRequestHandler):' '    def log_message(self, *x): pass' \
              '    def send(self, o):' '        b = json.dumps(o).encode(); self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)' \
              '    def do_GET(self): self.send({"status": "ok"} if self.path == "/health" else {"default_generation_settings": {"n_ctx": ctx}})' \
              '    def do_POST(self):' '        self.rfile.read(int(self.headers["Content-Length"]))' \
              '        self.send({"choices": [{"message": {"content": "same answer"}}], "timings": {"predicted_per_second": 45.6 if head else 26.2, "draft_n": 100 if head else 0, "draft_n_accepted": 70 if head else 0}})' \
              'http.server.HTTPServer(("127.0.0.1", int(a[a.index("--port") + 1])), H).serve_forever()' > "$B/llama-server"
            out=$(PATH="$F:$PATH" bash "$BONSAI_DIR/bench-bonsai.sh"); echo "$out"
            grep -q 'speed with the head (mtp n-max ${{ matrix.nmax }}): 45.6 / 45.6 / 45.6 tok/s, median 45.6 tok/s, draft 210/300 accepted' <<< "$out"
            grep -q 'speed without the head: 26.2 / 26.2 / 26.2 tok/s, median 26.2 tok/s' <<< "$out"
            grep -q 'same greedy text with and without the head: yes' <<< "$out"
            grep -q 'vram with the head: 512 MiB loaded' <<< "$out"
            grep -q '(linux, cuda): 45.6 tok/s with the mtp head, 26.2 without' <<< "$out"
            [ -z '${{ matrix.variant }}' ] || grep -q 'offrail 27b on my' <<< "$out"
            ls "$BONSAI_DIR"/$SLUG-results-*.txt
          else
            # Radeon: the start script against a stand-in llama-server that lists the Vulkan devices and prints its arguments
            grep -q 'TIER=${{ matrix.tier }} ' "$BONSAI_DIR/start-bonsai.sh"
            B="$BONSAI_DIR/llama-prism-b10772-e8fd209-bin-ubuntu-vulkan-x64"; mkdir -p "$B"
            printf '%s\n' '#!/bin/bash' \
              'if [ "${1:-}" = --list-devices ]; then echo "Available devices:"; tr ";" "\n" <<< "$FAKE_VK"; exit 0; fi' \
              'echo "SERVER ARGS: $*"' > "$B/llama-server"
            chmod +x "$B/llama-server"
            out=$(FAKE_VK='${{ matrix.vk }}' bash "$BONSAI_DIR/start-bonsai.sh"); echo "$out"
            args=$(grep '^SERVER ARGS:' <<< "$out")
            # the Radeon script is written from a quoted heredoc, so it passes the model name through API_ALIAS:
            # check the variable it bakes and the arguments llama-server really receives
            grep -q "API_ALIAS=$WANT_ALIAS" "$BONSAI_DIR/start-bonsai.sh"
            grep -q -- "--alias $WANT_ALIAS " <<< "$args"
            grep -q -- '--device ${{ matrix.dev }} ' <<< "$args"
            grep -q -- '--spec-draft-n-max 2' <<< "$args"
            case '${{ matrix.tier }}' in
              8gb)  grep -q -- '-c ${{ matrix.ctx8 }} --fit off -ub 256' <<< "$args" && grep -q "$LEAN" <<< "$args" ;;
              16gb) grep -q -- '--mmproj' <<< "$args" && grep -q -- '--fit on' <<< "$args" && ! grep -q -- '-ub 256' <<< "$args" ;;
              12gb) grep -q -- '--fit on --fit-target 1024 --fit-ctx 16384 -ub 256' <<< "$args" && ! grep -q -- '--mmproj' <<< "$args" ;;
            esac
            if [ '${{ matrix.dq }}' = yes ]; then grep -q -- '-ctkd q4_0 -ctvd q4_0' <<< "$args"; else ! grep -q -- '-ctkd' <<< "$args"; fi
            # BONSAI_HEAD=off drops the speed head, the way the speed check's second pass starts it
            out=$(FAKE_VK='${{ matrix.vk }}' BONSAI_HEAD=off bash "$BONSAI_DIR/start-bonsai.sh"); echo "$out"
            ! grep -q 'draft-mtp' <<< "$(grep '^SERVER ARGS:' <<< "$out")"
            # the speed check end to end against a stand-in server that answers /health, /props and chat with fixed timings
            bash -n "$BONSAI_DIR/bench-bonsai.sh"
            printf '%s\n' '#!/usr/bin/env python3' 'import http.server, json, os, sys' 'a = sys.argv[1:]' \
              'if a[:1] == ["--list-devices"]:' '    print("Available devices:"); print(os.environ["FAKE_VK"].replace(";", "\n")); sys.exit(0)' \
              'head = "--spec-type" in a; ctx = int(a[a.index("-c") + 1]) if "-c" in a else 131072' \
              'class H(http.server.BaseHTTPRequestHandler):' '    def log_message(self, *x): pass' \
              '    def send(self, o):' '        b = json.dumps(o).encode(); self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)' \
              '    def do_GET(self): self.send({"status": "ok"} if self.path == "/health" else {"default_generation_settings": {"n_ctx": ctx}})' \
              '    def do_POST(self):' '        self.rfile.read(int(self.headers["Content-Length"]))' \
              '        self.send({"choices": [{"message": {"content": "same answer" if head else "other answer"}}], "timings": {"predicted_per_second": 45.6 if head else 26.2, "draft_n": 100 if head else 0, "draft_n_accepted": 70 if head else 0}})' \
              'http.server.HTTPServer(("127.0.0.1", int(a[a.index("--port") + 1])), H).serve_forever()' > "$B/llama-server"
            out=$(FAKE_VK='${{ matrix.vk }}' bash "$BONSAI_DIR/bench-bonsai.sh"); echo "$out"
            grep -q 'speed with the head (mtp n-max 2): 45.6 / 45.6 / 45.6 tok/s, median 45.6 tok/s, draft 210/300 accepted' <<< "$out"
            grep -q 'speed without the head: 26.2 / 26.2 / 26.2 tok/s, median 26.2 tok/s' <<< "$out"
            grep -q 'head gain: +74%' <<< "$out"
            grep -q 'same greedy text with and without the head: NO' <<< "$out"
            grep -q '(linux, vulkan): 45.6 tok/s with the mtp head, 26.2 without' <<< "$out"
            [ -z '${{ matrix.variant }}' ] || grep -q 'offrail 27b on my' <<< "$out"
            ls "$BONSAI_DIR"/$SLUG-results-*.txt
          fi

  # The real files: download, SHA256 check and unpack exactly as a user gets them, minus the 7 GB model. NVIDIA builds come
  # from Hugging Face, the Radeon builds from PrismML's GitHub release.
  windows-download:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { card: 'RTX 3060 12GB', gpu: '0, NVIDIA GeForce RTX 3060, 12288, 595.95, 8.6', zip: 'bonsai2-small-gpu-windows-x64-cuda12.4-sm86-sm89-ff41412',
              exe: 'bonsai2-small-gpu-windows-x64-cuda12.4-sm86-sm89-ff41412\bin\llama-server.exe' }
          - { card: 'RTX 5060 Ti 16GB', gpu: '0, NVIDIA GeForce RTX 5060 Ti, 16311, 595.95, 12.0', zip: 'bonsai2-small-gpu-windows-x64-cuda13.3-sm120-ff41412',
              exe: 'bonsai2-small-gpu-windows-x64-cuda13.3-sm120-ff41412\bin\llama-server.exe' }
          - { card: 'Radeon RX 7600 8GB', amd: 'AMD Radeon RX 7600, 8192, 16304, 25.9.1', zip: 'llama-prism-b10772-e8fd209-bin-win-vulkan-x64',
              exe: 'llama-prism-b10772-e8fd209-bin-win-vulkan-x64\llama-server.exe' }
    name: windows download ${{ matrix.card }}
    steps:
      - uses: actions/checkout@v4
      - name: Real download, then start the exe from the installed folder
        shell: powershell
        env:
          BONSAI_FAKE_GPU: ${{ matrix.gpu }}
          BONSAI_FAKE_AMD: ${{ matrix.amd }}
          BONSAI_SKIP_MODEL: '1'
          BONSAI_NO_START: '1'
          BONSAI_HUB_DIR: ${{ github.workspace }}
          BONSAI_DIR: ${{ runner.temp }}\bonsai2
        run: |
          Get-Content .\install.ps1 -Raw | Invoke-Expression
          $exe = "$env:BONSAI_DIR\${{ matrix.exe }}"
          if (-not (Test-Path $exe)) { throw "$exe missing after the install" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'the installed llama-server.exe did not start' }
          Get-ChildItem "$env:BONSAI_DIR\${{ matrix.zip }}" | Select-Object Name | Out-String | Write-Host

  linux-download:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { card: 'RTX 3060 12GB', gpu: '0, NVIDIA GeForce RTX 3060, 12288, 595.95, 8.6', bundle: 'bonsai2-small-gpu-linux-x64-cuda12.4-sm86-sm89-285542d', server: 'bin/llama-server' }
          - { card: 'RTX 5060 Ti 16GB', gpu: '0, NVIDIA GeForce RTX 5060 Ti, 16311, 595.95, 12.0', bundle: 'bonsai2-small-gpu-linux-x64-cuda12.8-sm120-ff41412', server: 'bin/llama-server' }
          - { card: 'Radeon RX 7600 8GB', drm: 'card1 0x1002 8176 15000 AMD Radeon RX 7600', bundle: 'llama-prism-b10772-e8fd209-bin-ubuntu-vulkan-x64', server: 'llama-server' }
    name: linux download ${{ matrix.card }}
    steps:
      - uses: actions/checkout@v4
      - name: A fake Radeon in /sys/class/drm, and Mesa's Vulkan driver
        if: matrix.drm != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers libvulkan1 >/dev/null
          read -r card vendor vram gtt name <<< '${{ matrix.drm }}'
          d="$RUNNER_TEMP/drm/$card/device"; mkdir -p "$d"
          echo "$vendor" > "$d/vendor"; echo $((vram * 1048576)) > "$d/mem_info_vram_total"; echo $((gtt * 1048576)) > "$d/mem_info_gtt_total"
          echo "$name" > "$d/product_name"
      - name: Real download (no GPU here, so the binary is checked, not started on a card)
        env:
          BONSAI_FAKE_GPU: ${{ matrix.gpu }}
          BONSAI_DRM: ${{ runner.temp }}/drm
          BONSAI_SKIP_MODEL: '1'
          BONSAI_NO_START: '1'
          BONSAI_DIR: ${{ runner.temp }}/bonsai2
        run: |
          cat install.sh | bash
          test -x "$BONSAI_DIR/${{ matrix.bundle }}/${{ matrix.server }}"
          bash -n "$BONSAI_DIR/start-bonsai.sh"
          file "$BONSAI_DIR/${{ matrix.bundle }}/${{ matrix.server }}"
          if [ -n '${{ matrix.drm }}' ]; then "$BONSAI_DIR/${{ matrix.bundle }}/llama-server" --version; fi

  # The Radeon support must not change a byte of what NVIDIA owners get: the same fake NVIDIA cards (and no card at all)
  # through main's installers and this branch's, the console output and every written file compared byte for byte.
  nvidia-unchanged:
    runs-on: windows-2022
    name: NVIDIA output unchanged from main, Windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The same cards through main and this branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          git worktree add "$env:RUNNER_TEMP\main" origin/main 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'git worktree add failed' }
          $ErrorActionPreference = 'Stop'
          $cards = @('0, NVIDIA GeForce RTX 3060, 12288, 595.95, 8.6', '0, NVIDIA GeForce RTX 5060 Ti, 16311, 595.95, 12.0',
                     '0, NVIDIA RTX 3000 Ada Generation Laptop GPU, 8188, 595.95, 8.9',
                     '0, NVIDIA GeForce RTX 5070, 12227, 572.16, 12.0', '')
          $env:BONSAI_TEST = '1'; $env:BONSAI_FAKE_FREE = '7900'
          $bad = 0
          foreach ($card in $cards) {
            $got = @{}
            foreach ($side in 'main', 'branch') {
              $hub = if ($side -eq 'main') { "$env:RUNNER_TEMP\main" } else { $env:GITHUB_WORKSPACE }
              $d = "$env:RUNNER_TEMP\nv"
              $env:BONSAI_DIR = $d; $env:BONSAI_HUB_DIR = $hub; $env:BONSAI_FAKE_GPU = $card
              $text = & { Get-Content "$hub\install.ps1" -Raw | Invoke-Expression } *>&1 | Out-String
              foreach ($f in 'bonsai2.json', 'start-bonsai.bat', 'bench-bonsai.bat') { if (Test-Path "$d\$f") { $text += [IO.File]::ReadAllText("$d\$f") } }
              if (Test-Path "$d\bonsai2.ps1") { $text += (powershell -NoProfile -ExecutionPolicy Bypass -File "$d\bonsai2.ps1" print | Out-String) }
              # the intended changes: the repo rename of v1.3, and bonsai2.json gaining the build's own names
              # (variant, name, alias, slug) so the uncensored build can label itself
              $norm = $text.Replace('local-ai-on-your-gaming-rtx', 'local-ai-on-your-gaming-gpu')
              $norm = [regex]::Replace($norm, '(?m)^\s*"(variant|name|alias|slug)":\s*".*?",?\r?\n', '')
              $got[$side] = $norm
              if (Test-Path $d) { Rename-Item $d "nv-$side-$([array]::IndexOf($cards, $card))" }
            }
            $name = if ($card) { $card } else { 'no NVIDIA card, no Radeon' }
            if ($got['main'] -ceq $got['branch']) { Write-Host "same: $name" }
            else { $bad++; Write-Host "DIFFERENT: $name"; Write-Host '--- main'; Write-Host $got['main']; Write-Host '--- branch'; Write-Host $got['branch'] }
          }
          if ($bad) { throw "$bad NVIDIA cases changed" }

  # v1.4 changes the NVIDIA start script on purpose (the BONSAI_HEAD switch, the speed check), so on Linux the guard
  # compares what decides a covered card's result: the card / bundle / model lines, the exit code, and the exact arguments
  # llama-server gets from start-bonsai.sh (stand-ins for nvidia-smi and llama-server), main against this branch.
  nvidia-unchanged-linux:
    runs-on: ubuntu-24.04
    name: NVIDIA serve line unchanged from main, Linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The same cards through main and this branch
        run: |
          git show origin/main:install.sh > "$RUNNER_TEMP/install_main.sh"
          cp install.sh "$RUNNER_TEMP/install_branch.sh"
          F="$RUNNER_TEMP/fakebin"; mkdir -p "$F"
          printf '%s\n' '#!/bin/bash' 'case "$*" in *memory.free*) echo 7900 ;; *) echo 512 ;; esac' > "$F/nvidia-smi"; chmod +x "$F/nvidia-smi"
          bad=0; n=0
          while IFS= read -r card; do
            n=$((n + 1))
            for side in main branch; do
              d="$RUNNER_TEMP/nv"
              out=$(BONSAI_FAKE_GPU="$card" BONSAI_TEST=1 BONSAI_DIR="$d" bash "$RUNNER_TEMP/install_$side.sh" 2>&1; echo "rc=$?")
              # the lines up to "Installed." and the exit code (the repo rename of v1.3 is the one intended text change)
              { sed -n '1,/^Installed\./p' <<< "$out" | grep -v '^Installed\.'; tail -1 <<< "$out"; } \
                | sed 's/local-ai-on-your-gaming-rtx/local-ai-on-your-gaming-gpu/g' > "$RUNNER_TEMP/out_$side"
              if [ -f "$d/start-bonsai.sh" ]; then
                B="$d/$(sed -n 's|^B="\$DIR/\(.*\)"$|\1|p' "$d/start-bonsai.sh")/bin"; mkdir -p "$B"
                printf '%s\n' '#!/bin/bash' 'echo "SERVER ARGS: $*"' > "$B/llama-server"; chmod +x "$B/llama-server"
                PATH="$F:$PATH" bash "$d/start-bonsai.sh" | grep '^SERVER ARGS:' >> "$RUNNER_TEMP/out_$side"
                grep '^export ' "$d/start-bonsai.sh" >> "$RUNNER_TEMP/out_$side"
              fi
              [ -d "$d" ] && mv "$d" "$RUNNER_TEMP/nv-$side-$n"
            done
            if cmp -s "$RUNNER_TEMP/out_main" "$RUNNER_TEMP/out_branch"; then echo "same: ${card:-no NVIDIA card, no Radeon}"; cat "$RUNNER_TEMP/out_branch"
            else bad=$((bad + 1)); echo "DIFFERENT: $card"; diff "$RUNNER_TEMP/out_main" "$RUNNER_TEMP/out_branch" || true; fi
          done <<'CARDS'
          0, NVIDIA GeForce RTX 3060, 12288, 595.95, 8.6
          0, NVIDIA GeForce RTX 5060 Ti, 16311, 595.95, 12.0
          0, NVIDIA RTX 3000 Ada Generation Laptop GPU, 8188, 595.95, 8.9
          0, NVIDIA GeForce RTX 5070, 12227, 572.16, 12.0

          CARDS
          [ "$bad" -eq 0 ]
